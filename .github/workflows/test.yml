name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax-check every script
        shell: bash
        run: for f in skills/*/scripts/*.mjs; do node --check "$f"; done
      - name: Run the test suite
        run: npm test
